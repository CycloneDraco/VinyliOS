# XcodeGen spec: `xcodegen generate` writes Vinyl.xcodeproj (not committed).
name: Vinyl
options:
  bundleIdPrefix: io.github.cyclonedraco
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "4"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic

targets:
  Vinyl:
    type: application
    platform: iOS
    sources:
      - path: Vinyl
      - path: Shared
      # The three.js renderer from Vinyl for macOS, copied as a folder.
      - path: Renderer
        type: folder
        buildPhase: resources
    dependencies:
      - target: VinylWidgets
    info:
      path: Config/Vinyl-Info.plist
      properties:
        CFBundleDisplayName: Vinyl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIStatusBarHidden: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        NSAppleMusicUsageDescription: Vinyl shows the song playing in Apple Music and lets you play, pause and skip it.
    # The shared keychain group is the only one listed, so it's the default
    # for every keychain item the app and widgets write.
    entitlements:
      path: Entitlements/Vinyl.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)io.github.cyclonedraco.vinyl.ios.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cyclonedraco.vinyl.ios
        PRODUCT_NAME: Vinyl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  VinylWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VinylWidgets
      - path: Shared
    info:
      path: Config/VinylWidgets-Info.plist
      properties:
        CFBundleDisplayName: Vinyl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Entitlements/VinylWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)io.github.cyclonedraco.vinyl.ios.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cyclonedraco.vinyl.ios.widgets
        PRODUCT_NAME: VinylWidgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        SKIP_INSTALL: YES

schemes:
  Vinyl:
    build:
      targets:
        Vinyl: all
        VinylWidgets: all
    run:
      config: Debug
    archive:
      config: Release
